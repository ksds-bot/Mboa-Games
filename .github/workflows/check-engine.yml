name: Check! rules engine tests

on:
  push:
    branches: [main]
    paths:
      - "src/lib/check-engine.ts"
      - "src/lib/check-engine.test.ts"
      - "package.json"
      - ".github/workflows/check-engine.yml"
  pull_request:
    paths:
      - "src/lib/check-engine.ts"
      - "src/lib/check-engine.test.ts"
      - "package.json"
      - ".github/workflows/check-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run unit tests
        run: npm test
